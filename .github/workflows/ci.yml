name: Java CI with Maven

on:
  push:
    branches: [ main", "feature-transferencia" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven
      - name: Build with Maven
        run: mvn -B test --file pom.xml